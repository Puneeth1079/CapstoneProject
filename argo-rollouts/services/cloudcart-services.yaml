apiVersion: v1
kind: Service
metadata:
  name: cloudcart-backend-stable
  namespace: cloudcart-system
  labels:
    app: cloudcart-backend
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app: cloudcart-backend
